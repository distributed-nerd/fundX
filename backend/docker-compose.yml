# Postgres for FundX.
#
# Port 5433 so it never collides with a system Postgres on 5432, and an explicit project
# name so it never adopts containers from another directory that happens to be called
# "backend" — Compose derives the project from the directory otherwise.
name: fundx

services:
  db:
    image: postgres:18
    container_name: fundx-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: fundx
      POSTGRES_PASSWORD: fundx
      POSTGRES_DB: fundx
    ports:
      - "5433:5432"
    volumes:
      # Postgres 18 images expect the mount at /var/lib/postgresql, not .../data —
      # mounting the subdirectory makes the container refuse to start.
      - fundx-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fundx -d fundx"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fundx-pgdata:
